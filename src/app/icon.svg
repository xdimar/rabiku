<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ca8a04" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="48" height="48" rx="12" fill="#1c1917" />

  <!-- Left Ring -->
  <circle
    cx="20"
    cy="25"
    r="11"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="3.5"
    filter="url(#glow)"
  />

  <!-- Right Ring (Interlocking) -->
  <circle
    cx="28"
    cy="23"
    r="11"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="3.5"
    filter="url(#glow)"
  />

  <!-- Diamond Sparkle Accent on top ring -->
  <path
    d="M 28 8 L 30 11 L 33 11 L 30.5 13 L 31.5 16 L 28 14 L 24.5 16 L 25.5 13 L 23 11 L 26 11 Z"
    fill="#fef9c3"
    filter="url(#glow)"
  />
  <circle cx="28" cy="12" r="1.5" fill="#ffffff" />
</svg>
